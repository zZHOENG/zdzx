<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>文章详情 · 中政集团</title>

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.luogu.com.cn/upload/image_hosting/x37au7h1.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://cdn.luogu.com.cn/upload/image_hosting/x37au7h1.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://cdn.luogu.com.cn/upload/image_hosting/x37au7h1.png">

    <!-- 字体与图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- MathJax 配置与脚本 -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                packages: ['base', 'ams', 'text', 'color', 'boldsymbol'],
                macros: { space: "\\ ", to: "\\to", sim: "\\sim", dots: "\\dots", cdots: "\\cdots" }
            },
            options: { ignoreHtmlClass: 'tex2jax_ignore', processHtmlClass: 'tex2jax_process' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
    <!-- Markdown 解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #f4f7fc 0%, #eef2f7 100%);
            color: #1f2a3e;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            flex: 1;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(100, 116, 139, 0.2);
        }
        .logo-area { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
        .about-image img { border-radius: 12px; max-width: 300px; height: auto; }
        .title-zone { text-align: right; }
        .typing-title {
            font-size: 2.0rem;
            font-weight: 600;
            background: linear-gradient(120deg, #3b4b6e, #6c5b9b);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            border-right: 3px solid #8b7bb5;
            white-space: nowrap;
            overflow: hidden;
            display: inline-block;
            animation: blinkCursor 0.75s step-end infinite;
        }
        @keyframes blinkCursor {
            0%, 100% { border-color: #8b7bb5; }
            50% { border-color: transparent; }
        }
        .sub { font-size: 0.8rem; color: #6f7d95; margin-top: 8px; }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #ffffffcc;
            backdrop-filter: blur(4px);
            border: 1px solid #bdcbe2;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #40557a;
            margin-bottom: 1.8rem;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }
        .btn-back:hover {
            background: #fff;
            border-color: #8fa1c2;
            color: #253c60;
        }
        .article-detail {
            background: #ffffffdd;
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 2rem 2rem 2.8rem;
            box-shadow: 0 10px 25px -12px rgba(0,0,0,0.1);
            border: 1px solid rgba(165, 185, 215, 0.5);
        }
        .detail-header {
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e9eef4;
            padding-bottom: 1.2rem;
        }
        .detail-title {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1f2e4a, #4a3f73);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.8rem;
        }
        .detail-meta {
            display: flex;
            gap: 1.8rem;
            font-size: 0.9rem;
            color: #6f7e9b;
        }
        .detail-content {
            font-size: 1rem;
            color: #1f2a44;
            line-height: 1.65;
        }
        .detail-content h1, .detail-content h2, .detail-content h3 {
            margin: 1.5rem 0 0.8rem;
            font-weight: 600;
        }
        .detail-content p { margin: 1rem 0; }
        .detail-content blockquote {
            border-left: 4px solid #a9c0e6;
            background: #f5f9ff;
            padding: 0.8rem 1.2rem;
            border-radius: 20px;
            margin: 1rem 0;
        }
        .detail-content ul, .detail-content ol { padding-left: 1.8rem; margin: 0.8rem 0; }
        .detail-content li { margin: 0.3rem 0; line-height: 1.6; }
        .detail-content img {
            max-width: 100%;
            border-radius: 24px;
            margin: 1rem 0;
            box-shadow: 0 5px 12px rgba(0,0,0,0.05);
        }
        .detail-content pre {
            background: #eef2fa;
            padding: 1rem;
            border-radius: 20px;
            overflow-x: auto;
        }
        .detail-content code {
            background: #eef2fa;
            padding: 0.2rem 0.4rem;
            border-radius: 12px;
            font-size: 0.9em;
        }
        .info-box {
            background: #eef3ff;
            border-radius: 24px;
            padding: 1.2rem 1.5rem;
            margin: 1.2rem 0;
            border-left: 6px solid #7c93c7;
        }
        .image-card {
            background: #f8faff;
            border-radius: 28px;
            padding: 0.8rem;
            text-align: center;
            margin: 1.4rem 0;
            border: 1px solid #dce5f2;
        }
        .image-card img { border-radius: 20px; margin: 0; }
        .error-message { color: #b91c1c; padding: 2rem; text-align: center; }
        .loading { text-align: center; padding: 3rem; color: #6f7d95; }
        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.75rem;
            color: #8c9bbb;
            border-top: 1px solid rgba(128, 147, 175, 0.2);
            padding-top: 2rem;
        }

        @media (max-width: 700px) {
            .container { padding: 1rem; }
            .header { flex-direction: column; align-items: flex-start; gap: 1rem; }
            .title-zone { text-align: left; width: 100%; }
            .typing-title {
                font-size: 1.4rem;
                white-space: normal;
                border-right: none;
                animation: none;
            }
            .detail-title { font-size: 1.6rem; }
        }

        @media (prefers-color-scheme: dark) {
            body { background: #121826; color: #e2e8f0; }
            .article-detail { background: #1e293b; border-color: #2d3748; }
            .detail-title {
                background: linear-gradient(135deg, #cbd5e6, #a5b4fc);
                -webkit-text-fill-color: transparent;
            }
            .detail-meta, .detail-content { color: #cbd5e1; }
            .detail-content blockquote {
                background: #0f172a;
                border-left-color: #6b7280;
                color: #e2e8f0;
            }
            .detail-content pre, .detail-content code { background: #0f172a; color: #e2e8f0; }
            .info-box { background: #0f172a; border-left-color: #818cf8; }
            .image-card { background: #0f172a; border-color: #334155; }
            .btn-back { background: #1e293b; border-color: #475569; color: #cbd5e6; }
            .btn-back:hover { background: #2d3a5e; border-color: #818cf8; color: white; }
            .header { border-bottom-color: rgba(100, 116, 139, 0.3); }
            .sub { color: #9ca3af; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部（与主页一致） -->
        <div class="header">
            <div class="logo-area">
                <div class="about-image">
                    <img src="https://zdzx.zhongzheng.tech/favicon_2.png" alt="中政集团 Logo" width="300" height="80">
                </div>
            </div>
            <div class="title-zone">
                <div class="typing-title" id="typingTitle"></div>
                <div class="sub">中政 ZHOENG · 河北正定中学办事处</div>
            </div>
        </div>

        <!-- 返回首页 -->
        <a class="btn-back" href="../../">
            <i class="fas fa-arrow-left"></i> 返回首页
        </a>

        <!-- 文章内容区域 -->
        <div id="articleDetailContent" class="article-detail">
            <div class="loading"><i class="fas fa-spinner fa-pulse"></i> 正在加载文章元数据…</div>
        </div>

        <footer>
            中政集团 · 中政科技 <span>&copy;</span> 2025-2026<br>
            中政 ZHOENG · 河北正定中学办事处 <span>&copy;</span> 2026-2026
        </footer>
    </div>

    <script>
        (function() {
            "use strict";

            // ---------- 配置 ----------
            const ARTICLES_JSON_PATH = '../../articles.json';  // 相对于当前文章目录的路径
            const MARKDOWN_FILE = './article.md';              // 正文文件（同目录下）

            // 工具函数：转义 HTML
            function escapeHtml(str) {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;' };
                return String(str).replace(/[&<>]/g, c => map[c]);
            }

            // 打字机效果
            function typeWriterEffect() {
                const titleElement = document.getElementById('typingTitle');
                if (!titleElement) return;
                const fullText = "中政集团 · 中政科技";
                let i = 0;
                titleElement.textContent = '';
                function type() {
                    if (i < fullText.length) {
                        titleElement.textContent += fullText.charAt(i);
                        i++;
                        setTimeout(type, 100);
                    } else {
                        titleElement.style.borderRightColor = 'transparent';
                    }
                }
                type();
            }

            // 加载本地 meta.json 获取 id
            async function loadLocalMeta() {
                const res = await fetch('./meta.json');
                if (!res.ok) throw new Error(`无法加载 meta.json (HTTP ${res.status})`);
                return await res.json();
            }

            // 加载全局 articles.json
            async function loadGlobalArticles() {
                const res = await fetch(ARTICLES_JSON_PATH);
                if (!res.ok) throw new Error(`无法加载全局文章列表 (HTTP ${res.status})`);
                return await res.json();
            }

            // 根据 id 从数组中查找文章数据
            function findArticleById(articles, id) {
                return articles.find(art => String(art.id) === String(id));
            }

            // 主渲染函数
            async function renderArticle() {
                const container = document.getElementById('articleDetailContent');
                if (!container) return;

                try {
                    // 1. 加载 meta.json 获取 id
                    const localMeta = await loadLocalMeta();
                    const articleId = localMeta.id;
                    if (!articleId) throw new Error('meta.json 中未指定 id');

                    // 2. 加载全局文章列表
                    const articles = await loadGlobalArticles();
                    const article = findArticleById(articles, articleId);
                    if (!article) throw new Error(`在 articles.json 中未找到 id 为 ${articleId} 的文章`);

                    // 更新页面标题
                    document.title = `${article.title} | 中政集团`;

                    // 3. 渲染文章头部信息
                    const headerHtml = `
                        <div class="detail-header">
                            <div class="detail-title">${escapeHtml(article.title)}</div>
                            <div class="detail-meta">
                                <span><i class="far fa-user"></i> ${escapeHtml(article.author)}</span>
                                <span><i class="far fa-calendar-alt"></i> ${escapeHtml(article.date)}</span>
                                <span><i class="far fa-folder"></i> ${escapeHtml(article.category)}</span>
                            </div>
                        </div>
                        <div class="detail-content" id="detailMarkdownBody">
                            <div class="loading"><i class="fas fa-spinner fa-pulse"></i> 加载正文中…</div>
                        </div>
                    `;
                    container.innerHTML = headerHtml;
                    const contentDiv = document.getElementById('detailMarkdownBody');

                    // 4. 加载同目录下的 Markdown 文件
                    let markdownText;
                    try {
                        const mdRes = await fetch(MARKDOWN_FILE);
                        if (!mdRes.ok) throw new Error(`HTTP ${mdRes.status}`);
                        markdownText = await mdRes.text();
                    } catch (mdError) {
                        console.error('Markdown 加载失败:', mdError);
                        contentDiv.innerHTML = `<div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i> 文章内容加载失败：${escapeHtml(mdError.message)}<br>
                            <small>请确认当前目录下存在 article.md 文件</small>
                        </div>`;
                        return;
                    }

                    // 5. 渲染 Markdown 为 HTML
                    const rawHtml = marked.parse(markdownText, { async: false });
                    contentDiv.innerHTML = rawHtml;

                    // 6. 触发 MathJax 渲染（如果有公式）
                    if (window.MathJax && typeof MathJax.typesetPromise === 'function') {
                        await MathJax.typesetPromise([contentDiv]);
                    }

                } catch (error) {
                    console.error('文章渲染失败:', error);
                    container.innerHTML = `<div class="error-message">
                        <i class="fas fa-exclamation-circle"></i> 加载失败：${escapeHtml(error.message)}
                    </div>`;
                }
            }

            // 页面初始化
            window.addEventListener('load', () => {
                typeWriterEffect();
                renderArticle();
            });
        })();
    </script>
</body>
</html>
